name: build

on:
  push:
    branches: [main]
    tags: ['openfoam-v*']
  pull_request:
  workflow_dispatch:
    inputs:
      linux:
        description: 'Build the Linux x64 kit'
        type: boolean
        default: true
      macos:
        description: 'Also build the macOS arm64 kit (Phase 0.4; long)'
        type: boolean
        default: false
      long:
        description: 'Run motorBike in the verification (minutes per platform)'
        type: boolean
        default: false

jobs:
  linux-x64:
    # Pinned rather than latest: the glibc the kit is built against is the
    # oldest one it will run on, and compute nodes are not all current. The
    # package list mirrors build/linux/Dockerfile.
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.linux }}
    runs-on: ubuntu-22.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc g++ make cmake flex libfl-dev bison m4 gawk \
            zlib1g-dev libreadline-dev libgmp-dev libmpfr-dev libmpc-dev \
            autoconf automake libtool pkg-config file curl zip unzip

      # Every download is pinned by checksum, so a cache hit is exactly the
      # same bytes and cannot mask a change.
      - name: Cache the pinned downloads
        uses: actions/cache@v4
        with:
          path: .build/deps
          key: deps-${{ hashFiles('build/config.sh') }}

      - name: Build and pack
        run: sh build/build.sh

      - name: Verify in a foreign image (Debian 12, no compiler, no libgomp)
        env:
          LONG: ${{ inputs.long && '1' || '0' }}
        run: |
          docker build -q -t openfoam-verify -f build/linux/Dockerfile.verify build/linux
          docker run --rm --shm-size=1g \
            -v "$PWD:/repo:ro" \
            -e VERIFY_ROOT=/home/verify/verify -e WORK=/home/verify/work -e LONG="$LONG" \
            openfoam-verify sh /repo/build/verify.sh /repo/.build/out/openfoam-linux-x64.zip

      - name: Keep the build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64-build-log
          path: .build/OpenFOAM-v2606/log.*
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: openfoam-linux-x64
          path: .build/out/

  macos-arm64:
    # Not on every push (about an hour and a half on this runner, and the
    # build needs a case-sensitive volume - upstream's own requirement): on
    # request, and on every release, where a macOS failure blocks the release
    # (see the release job). The eighth build (2026-09-23) was the first to
    # pass its acceptance with the build volume detached.
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.macos) || startsWith(github.ref, 'refs/tags/openfoam-v') }}
    runs-on: macos-14
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - name: Case-sensitive build volume
        run: |
          hdiutil create -size 40g -fs 'Case-sensitive APFS' -volname OpenFOAMBuild -type SPARSEBUNDLE "$RUNNER_TEMP/build.sparsebundle"
          hdiutil attach "$RUNNER_TEMP/build.sparsebundle" -mountpoint /Volumes/OpenFOAMBuild
          echo "WORK=/Volumes/OpenFOAMBuild/build" >> "$GITHUB_ENV"
          # The pinned downloads live off the volume: the volume is detached
          # before the acceptance, and the cache's post step must still find them.
          echo "DEPS_DIR=$HOME/openfoam-deps" >> "$GITHUB_ENV"

      - name: Toolchain
        run: brew install flex cmake

      - name: Cache the pinned downloads
        uses: actions/cache@v4
        with:
          path: ~/openfoam-deps
          key: deps-macos-${{ hashFiles('build/config.sh') }}

      - name: Build and pack
        run: sh build/build.sh

      # The acceptance must not be able to lean on the build: the kit and the
      # verification scripts are copied out, the build volume is DETACHED (the
      # sixth macOS build passed only because the libraries it pointed at on
      # that volume were still mounted), and the acceptance runs as a
      # dedicated unprivileged user, so the file-system audit can tell the
      # kit's writes from the runner's own.
      - name: Stage the kit off the build volume, detach the volume
        run: |
          mkdir -p "$RUNNER_TEMP/kit-out"
          cp "$WORK/out/"* "$RUNNER_TEMP/kit-out/"
          sudo rm -rf /private/tmp/ofverify-repo
          sudo mkdir -p /private/tmp/ofverify-repo
          sudo cp -R build /private/tmp/ofverify-repo/
          sudo cp "$WORK/out/openfoam-macos-arm64.zip" /private/tmp/ofverify-repo/
          sudo chmod -R a+rX /private/tmp/ofverify-repo
          hdiutil detach /Volumes/OpenFOAMBuild || hdiutil detach -force /Volumes/OpenFOAMBuild
          [ ! -d /Volumes/OpenFOAMBuild ] || { echo "the build volume is still mounted"; exit 1; }

      - name: A dedicated user for the acceptance
        run: |
          sudo dscl . -create /Users/ofverify
          sudo dscl . -create /Users/ofverify UniqueID 599
          sudo dscl . -create /Users/ofverify PrimaryGroupID 20
          sudo dscl . -create /Users/ofverify UserShell /bin/sh
          sudo dscl . -create /Users/ofverify NFSHomeDirectory /private/tmp/ofverify-home
          sudo mkdir -p /private/tmp/ofverify-home
          sudo chown ofverify:staff /private/tmp/ofverify-home
          sudo -u ofverify id

      - name: Verify from a plain folder, build volume detached, as ofverify
        id: verify
        env:
          LONG: ${{ inputs.long && '1' || '0' }}
        run: |
          sudo -u ofverify env -i \
            PATH=/usr/bin:/bin:/usr/sbin:/sbin \
            HOME=/private/tmp/ofverify-home \
            VERIFY_ROOT=/private/tmp/ofverify/verify \
            WORK=/private/tmp/ofverify/work \
            LONG="$LONG" \
            sh /private/tmp/ofverify-repo/build/verify.sh /private/tmp/ofverify-repo/openfoam-macos-arm64.zip

      # The kit is uploaded even when the acceptance fails: a kit that builds
      # but does not start elsewhere is exactly what has to be inspected.
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.verify.outcome != 'skipped' }}
        with:
          # Written as "failed && suffix || empty": the other order ("ok && '' || suffix")
          # always yields the suffix, because '' is falsy - the eighth macOS build
          # uploaded a verified kit as -unverified.
          name: openfoam-macos-arm64${{ steps.verify.outcome != 'success' && '-unverified' || '' }}
          path: ${{ runner.temp }}/kit-out/

  release:
    # Every kit job that ran must have succeeded; a skipped one (a platform not
    # built in this run) does not block.
    if: ${{ startsWith(github.ref, 'refs/tags/openfoam-v') && always() && needs.linux-x64.result == 'success' && (needs.macos-arm64.result == 'success' || needs.macos-arm64.result == 'skipped') }}
    needs: [linux-x64, macos-arm64]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: kits
      - name: Checksums over every asset
        run: |
          cd kits
          find . -name '*.zip' -exec mv {} . \;
          sha256sum *.zip > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            kits/*.zip
            kits/SHA256SUMS
          body: |
            OpenFOAM® v2606 kits for OmnibusCloud compute nodes. Corresponding source: this repository at this tag and the release `upstream-mirror-v2606`. See `PROVENANCE.md`.

            OpenFOAM® is a registered trademark of OpenCFD Limited. This offering is not approved or endorsed by OpenCFD Limited, producer and distributor of the OpenFOAM software via www.openfoam.com, and owner of the OPENFOAM® and OpenCFD® trade marks.
